name: Build Android e Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  JUCE_VERSION: "9.0.4"
  NDK_VERSION: "28.1.13356709"
  CMAKE_VERSION: "3.22.1"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java (8 per il toolchain JUCE, 17 per Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17

      # JUCE + Projucer compilato vengono messi in cache: dalla seconda build in poi si risparmiano minuti.
      - name: Cache JUCE e Projucer
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}-projucer-v1

      - name: Scarica JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      - name: Compila Projucer
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxrender-dev libxcomposite-dev libxi-dev
          # Projucer serve solo da riga di comando: curl non serve.
          ci/run-logged.sh "Projucer" make -C JUCE/extras/Projucer/Builds/LinuxMakefile CONFIG=Release -j"$(nproc)" \
            CPPFLAGS="-UJUCE_USE_CURL -DJUCE_USE_CURL=0"

      - name: Genera il progetto Android
        run: ci/run-logged.sh "Projucer resave" JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer --resave JLoop.jucer

      - name: Installa NDK e CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # Sempre la stessa chiave di firma: cosi' ogni nuovo APK si installa sopra il precedente.
      - name: Chiave di firma
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Builds/Android/**/*.gradle', 'Builds/Android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Compila APK
        working-directory: Builds/Android
        run: |
          chmod +x gradlew
          ../../ci/run-logged.sh "Gradle" ./gradlew assembleRelease_Release --no-daemon \
            -Porg.gradle.java.installations.paths="$JAVA_HOME_8_X64,$JAVA_HOME_17_X64"

      - name: Prepara APK
        id: apk
        run: |
          APK=$(find Builds/Android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Trovato: $APK"
          cp "$APK" JLoop.apk

      - name: Carica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLoop-apk
          path: JLoop.apk

  windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache JUCE e Projucer (Windows)
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_VERSION }}-projucer-win-v1

      - name: Scarica JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      - name: MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compila Projucer
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: msbuild JUCE\extras\Projucer\Builds\VisualStudio2022\Projucer.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Genera il progetto Visual Studio
        run: JUCE\extras\Projucer\Builds\VisualStudio2022\x64\Release\App\Projucer.exe --resave JLoop.jucer

      # ASIO (schede audio esterne a bassa latenza): SDK di Steinberg, ora con licenza GPLv3.
      # Se il download non riesce si compila lo stesso, senza ASIO.
      - name: ASIO SDK (facoltativo)
        shell: pwsh
        run: |
          try {
            Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asio.zip -MaximumRedirection 10
            Expand-Archive asio.zip -DestinationPath asiosdk -Force
            $h = Get-ChildItem asiosdk -Recurse -Filter iasiodrv.h | Select-Object -First 1
            if ($h) { "ASIO_INCLUDE=$($h.DirectoryName)" | Out-File $env:GITHUB_ENV -Append; Write-Host "ASIO trovato: $($h.DirectoryName)" }
            else { Write-Host "ASIO SDK scaricato ma senza iasiodrv.h: compilo senza ASIO" }
          } catch { Write-Host "ASIO SDK non scaricato: compilo senza ASIO ($_)" }

      - name: Compila JLoop.exe
        shell: pwsh
        run: |
          if ($env:ASIO_INCLUDE) { $env:CL = "/DJUCE_ASIO=1 /I`"$env:ASIO_INCLUDE`""; Write-Host "Con ASIO" }
          msbuild Builds\VisualStudio2022\JLoop.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = ([xml](Get-Content JLoop.jucer)).JUCERPROJECT.version
          $exe = (Resolve-Path "Builds\VisualStudio2022\x64\Release\App\JLoop.exe").Path
          & $iscc "/DMyAppVersion=$version" "/DSourceExe=$exe" "ci\windows\jloop.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Carica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLoop-windows
          path: dist/JLoop-Setup.exe

  publish:
    needs: [android, windows]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scarica i file compilati
        uses: actions/download-artifact@v4
        with:
          path: out

      # Pubblica sempre agli stessi link: .../releases/download/latest-build/JLoop.apk e JLoop-Setup.exe
      # (solo se questo commit e' ancora l'ultimo di main: una build vecchia arrivata in ritardo non sovrascrive quella nuova)
      - name: Pubblica release "latest-build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          BUILT=$(git rev-parse HEAD)
          if [ "$LATEST" != "$BUILT" ]; then
            echo "Questo commit ($BUILT) non e' piu' l'ultimo ($LATEST): non pubblico."
            exit 0
          fi
          FILES="out/JLoop-apk/JLoop.apk"
          NOTE="APK per Android"
          if [ -f out/JLoop-windows/JLoop-Setup.exe ]; then
            FILES="$FILES out/JLoop-windows/JLoop-Setup.exe"
            NOTE="$NOTE e installer per Windows (JLoop-Setup.exe)"
          fi
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build $FILES \
            --target "$BUILT" \
            --prerelease \
            --title "JLoop - ultima build (${BUILT::7})" \
            --notes "$NOTE compilati automaticamente dal commit ${BUILT::7}."
